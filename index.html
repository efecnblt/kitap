<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#14111f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Bugün Ne Okusam?</title>
  <meta name="description" content="Polisiye, Aşk ve Drama türlerinde kişisel kitap önerileri. Zar at, bugünün kitabını bul." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-orbs" aria-hidden="true"><span></span><span></span><span></span></div>

  <header class="top">
    <div class="brand">
      <span class="brand-mark">📚</span>
      <div>
        <h1>Bugün Ne Okusam?</h1>
        <p class="sub">Polisiye · Aşk · Drama</p>
      </div>
    </div>
    <button class="icon-btn" id="favToggle" aria-label="Okuma listem">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M6 2h12a1 1 0 0 1 1 1v19l-7-4-7 4V3a1 1 0 0 1 1-1z"/></svg>
      <span class="badge" id="favCount">0</span>
    </button>
  </header>

  <section class="hero">
    <p class="hero-kicker">Kararsız mısın?</p>
    <h2>Zarı at, bugünün kitabı seni bulsun.</h2>
    <button class="dice-cta" id="rollBtn">
      <span class="mini-die">🎲</span> Zar At
    </button>
  </section>

  <nav class="chips" id="chips" aria-label="Tür filtresi">
    <button class="chip active" data-g="all">Tümü</button>
    <button class="chip" data-g="polisiye">🔍 Polisiye</button>
    <button class="chip" data-g="ask">❤️ Aşk</button>
    <button class="chip" data-g="drama">🎭 Drama</button>
  </nav>

  <div class="search-wrap">
    <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M10 2a8 8 0 0 1 6.32 12.9l5.39 5.4-1.41 1.4-5.4-5.39A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg>
    <input id="search" type="search" placeholder="Kitap ya da yazar ara…" autocomplete="off" />
  </div>

  <p class="list-title" id="listTitle"></p>
  <main class="grid" id="grid" aria-live="polite"></main>

  <div class="more-wrap">
    <button class="more-btn" id="moreBtn">
      <span class="spinner"></span><span class="label">🌐 İnternetten daha fazla kitap keşfet</span>
    </button>
    <p class="more-note" id="moreNote"></p>
  </div>

  <footer class="foot">Kitap verileri ve kapaklar: <a href="https://openlibrary.org" target="_blank" rel="noopener">Open Library</a></footer>

  <!-- Detay paneli -->
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-handle"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <!-- Zar modu -->
  <section class="dice-modal" id="diceModal" role="dialog" aria-modal="true" aria-label="Zar at">
    <button class="close-x" id="diceClose" aria-label="Kapat">✕</button>
    <div class="dice-genres" id="diceGenres">
      <button class="chip active" data-g="all">Hepsi</button>
      <button class="chip" data-g="polisiye">Polisiye</button>
      <button class="chip" data-g="ask">Aşk</button>
      <button class="chip" data-g="drama">Drama</button>
    </div>
    <div class="dice-stage" id="diceStage">
      <div class="scene">
        <div class="cube" id="cube">
          <div class="face f1"><i></i></div>
          <div class="face f2"><i></i><i></i></div>
          <div class="face f3"><i></i><i></i><i></i></div>
          <div class="face f4"><i></i><i></i><i></i><i></i></div>
          <div class="face f5"><i></i><i></i><i></i><i></i><i></i></div>
          <div class="face f6"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        </div>
      </div>
      <div class="cube-shadow"></div>
      <p class="dice-hint" id="diceHint">Zara dokun ya da aşağıdaki butona bas</p>
    </div>
    <div class="dice-result" id="diceResult"></div>
    <div class="dice-actions">
      <button class="dice-cta" id="rollAgain"><span class="mini-die">🎲</span> <span id="rollLabel">Zarı At</span></button>
    </div>
  </section>

  <div class="confetti" id="confetti" aria-hidden="true"></div>
  <div class="toast" id="toast"></div>

  <script src="books.js"></script>
  <script src="app.js"></script>
</body>
</html>
