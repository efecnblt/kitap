<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Bugün Ne Okusam?</title>
  <meta name="description" content="Polisiye, Aşk ve Drama türlerinde kişisel kitap önerileri. Zar at, bugünün kitabını bul." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23111'/><circle cx='11' cy='11' r='2.6' fill='%23fff'/><circle cx='21' cy='21' r='2.6' fill='%23fff'/><circle cx='16' cy='16' r='2.6' fill='%23fff'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=3" />
</head>
<body>
  <div class="welcome" id="welcome" aria-hidden="true">
    <div class="welcome-inner">
      <p class="welcome-small">Hoş geldin</p>
      <h2>Merhaba, <em>Gözde.</em></h2>
      <span class="welcome-line"></span>
    </div>
  </div>

  <header class="top">
    <a class="brand" href="#" aria-label="Ana sayfa">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="brand-name">okusam</span>
    </a>
    <button class="icon-btn" id="favToggle" aria-label="Okuma listem">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6.5 3.5h11v17l-5.5-3.6-5.5 3.6z"/></svg>
      <span class="badge" id="favCount">0</span>
    </button>
  </header>

  <section class="hero">
    <p class="hero-kicker">Merhaba Gözde</p>
    <h1>Bugün ne <em>okusan?</em></h1>
    <p class="hero-sub">Polisiye, aşk ve drama arasından seçilmiş kitaplar. Karar veremiyorsan zarı at.</p>
    <button class="primary-btn" id="rollBtn">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.5" fill="currentColor"/></svg>
      Zar at
    </button>
  </section>

  <div class="toolbar">
    <nav class="chips" id="chips" aria-label="Tür filtresi">
      <button class="chip active" data-g="all">Tümü</button>
      <button class="chip" data-g="polisiye"><span class="dot polisiye"></span>Polisiye</button>
      <button class="chip" data-g="ask"><span class="dot ask"></span>Aşk</button>
      <button class="chip" data-g="drama"><span class="dot drama"></span>Drama</button>
    </nav>
  </div>

  <div class="search-wrap">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5" stroke-linecap="round"/></svg>
    <input id="search" type="search" placeholder="Kitap ya da yazar ara" autocomplete="off" />
  </div>

  <p class="list-title" id="listTitle"></p>
  <main class="grid" id="grid" aria-live="polite"></main>

  <div class="more-wrap">
    <button class="secondary-btn" id="moreBtn">
      <span class="spinner"></span><span class="label">İnternetten daha fazla kitap getir</span>
    </button>
    <p class="more-note" id="moreNote"></p>
  </div>

  <footer class="foot">Kitap verileri ve kapaklar <a href="https://openlibrary.org" target="_blank" rel="noopener">Open Library</a>'den.</footer>

  <!-- Detay paneli -->
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-handle"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <!-- Zar modu -->
  <section class="dice-modal" id="diceModal" role="dialog" aria-modal="true" aria-label="Zar at">
    <div class="dice-top">
      <span class="dice-title">Zar at</span>
      <button class="icon-btn" id="diceClose" aria-label="Kapat">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="dice-genres chips" id="diceGenres">
      <button class="chip active" data-g="all">Hepsi</button>
      <button class="chip" data-g="polisiye"><span class="dot polisiye"></span>Polisiye</button>
      <button class="chip" data-g="ask"><span class="dot ask"></span>Aşk</button>
      <button class="chip" data-g="drama"><span class="dot drama"></span>Drama</button>
    </div>
    <div class="dice-stage" id="diceStage">
      <div class="scene">
        <div class="cube" id="cube">
          <div class="face f1"><i></i></div>
          <div class="face f2"><i></i><i></i></div>
          <div class="face f3"><i></i><i></i><i></i></div>
          <div class="face f4"><i></i><i></i><i></i><i></i></div>
          <div class="face f5"><i></i><i></i><i></i><i></i><i></i></div>
          <div class="face f6"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        </div>
      </div>
      <div class="cube-shadow"></div>
      <p class="dice-hint" id="diceHint">Zar dönüyor…</p>
    </div>
    <div class="dice-result" id="diceResult"></div>
    <div class="dice-actions">
      <button class="primary-btn" id="rollAgain">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.5" fill="currentColor"/></svg>
        <span id="rollLabel">Zarı at</span>
      </button>
    </div>
  </section>

  <div class="toast" id="toast"></div>

  <script src="books.js?v=3"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
